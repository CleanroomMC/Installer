pluginManagement {
    repositories {
        maven {
            url = 'https://maven.cleanroommc.com'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'com.cleanroommc.conventions.settings' version '1.4.1'
}

rootProject.name = 'Installer'

include 'core'
include 'ui'
include 'app'
