name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      validate-only:
        description: Validate publication metadata without uploading
        type: boolean
        default: false

concurrency:
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Test
        run: ./gradlew test

      - name: Print version
        run: ./gradlew -q :printVersion -Pversioning.publish

      - name: Publish to Cleanroom Maven
        if: ${{ !inputs.validate-only }}
        env:
          ORG_GRADLE_PROJECT_CleanroomMavenUsername: ${{ secrets.MAVEN_NAME }}
          ORG_GRADLE_PROJECT_CleanroomMavenPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: ./gradlew publish --no-configuration-cache -Pversioning.publish
